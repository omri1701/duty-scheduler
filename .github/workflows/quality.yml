name: Quality

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
      TZ: UTC
      CLOUDFLARE_CF_FETCH_ENABLED: "false"
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.19.0"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false # Reads the exact packageManager version in package.json.
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate AI configuration
        run: python3 scripts/validate-ai-config.py
      - name: Regression tests
        run: node --test tests/*.test.mjs
      - name: Type check
        run: pnpm exec tsc --noEmit
      - name: Reject lint regressions
        run: node scripts/lint-regressions.mjs
      - name: Production build
        run: pnpm build
